name: Java pet project

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Grant execute permission for thought mvnw
      run: chmod +x services/thought/mvnw

    - name: Run tests for thought service
      working-directory: ./services/thought
      run: ./mvnw test

    - name: Run tests for auth-service
      working-directory: ./services/auth-service
      run: ./mvnw test