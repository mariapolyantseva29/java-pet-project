<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <script src="https://cdn.tailwindcss.com"></script>
        <title>New Situation</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
    </head>

    <body class="bg-gray-100 font-sans">
        <div class="flex h-screen overflow-hidden">
            <!-- Sidebar -->
            <div class="w-64 bg-white border-r border-gray-200 flex flex-col">
                <div class="p-6 border-b">
                    <h1 class="text-2xl font-bold text-gray-900 flex items-center gap-2">
                        <i class="fa-solid fa-seedling"></i> Thought audit
                    </h1>
                    <p class="text-sm text-gray-500 mt-1">Живи спокойно и свободно</p>
                </div>
                <div class="p-3">
                    <button onclick="window.location.href='/situations'" class="w-full flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-xl font-medium">
                        <i class="fa-solid fa-house w-5"></i>
                        <span>Home</span>
                    </button>
                    <button onclick="window.location.href='/situations/new'" class="w-full flex items-center gap-3 px-4 py-3 hover:bg-gray-50 text-gray-700 rounded-xl font-medium">
                        <i class="fa-solid fa-list-check w-5"></i>
                        <span>New Tasks</span>
                    </button>
                    <button onclick="window.location.href='/situations'" class="w-full flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-xl font-medium">
                        <i class="fa-solid fa-folder w-5"></i>
                        <span>Log out</span>
                    </button>
                </div>
            </div>

            <!-- Main Content -->
            <div class="flex-1 overflow-auto">
                <div class="p-8">
                    <div class="max-w-4xl mx-auto">
                        <!-- Header -->
                        <div class="flex justify-between items-center mb-10 pl-5 pr-5">
                            <h2 class="text-3xl font-semibold text-gray-900">Новая ситуация</h2>
                            <a href="/situations"
                               class="text-gray-500 hover:text-gray-700 flex items-center gap-2">
                                <i class="fa-solid fa-arrow-left"></i>
                                <span>Назад к списку</span>
                            </a>
                        </div>

                        <form th:action="@{/situations}" method="post" class="bg-white rounded-3xl shadow-sm p-10 space-y-8">
                            <!-- Большое поле на всю ширину -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-3">
                                    Описание ситуации
                                </label>
                                <textarea name="description" rows="4"
                                          class="w-full px-6 py-5 border border-gray-200 rounded-3xl focus:outline-none focus:border-gray-500 focus:ring-2 focus:ring-gray-200 resize-y text-lg"
                                          placeholder="Опишите ситуацию или мысль, после которой вы почувствовали себя плохо"></textarea>
                            </div>

                            <!-- Thoughts -->
                            <div id="thoughts-grid" class="grid grid-cols-1 md:grid-cols-1 gap-6">
                                <div class="thought-pair grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div class="block text-sm font-medium text-gray-700 mb-1">Критическая мысль</div>
                                    <div class="block text-sm font-medium text-gray-700 mb-1">Реальная мысль</div>
                                </div>

                                <div class="thought-pair grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <textarea name="thoughts[0].criticalContent" rows="2"
                                                  class="thought-edit w-full px-6 py-5 border border-gray-200 rounded-3xl focus:outline-none focus:border-gray-500 focus:ring-2 focus:ring-gray-200 resize-y text-lg overflow-hidden"
                                                  placeholder="Какие негативные мысли вызывает эта ситуация?"></textarea>
                                    </div>
                                    <div>
                                        <textarea name="thoughts[0].realContent" rows="2"
                                                  class="thought-edit w-full px-6 py-5 border border-gray-200 rounded-3xl focus:outline-none focus:border-gray-500 focus:ring-2 focus:ring-gray-200 resize-y text-lg overflow-hidden"
                                                  placeholder="Какая более реалистичная и спокойная мысль здесь возможна?"></textarea>
                                    </div>
                                </div>

                                <div class="thought-pair grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <textarea name="thoughts[1].criticalContent" rows="2"
                                                  class="thought-edit w-full px-6 py-5 border border-gray-200 rounded-3xl focus:outline-none focus:border-gray-500 focus:ring-2 focus:ring-gray-200 resize-y text-lg overflow-hidden">
                                        </textarea>
                                    </div>
                                    <div>
                                        <textarea name="thoughts[1].realContent" rows="2"
                                                  class="thought-edit w-full px-6 py-5 border border-gray-200 rounded-3xl focus:outline-none focus:border-gray-500 focus:ring-2 focus:ring-gray-200 resize-y text-lg overflow-hidden">
                                        </textarea>
                                    </div>
                                </div>
                            </div>

                            <div>
                                <button id="add-thought" type="button">
                                    <span class="text-2xl leading-none text-gray-700">+</span>
                                    <span class="font-medium">Добавить мысль</span>
                                </button>
                            </div>

                            <!-- Кнопки -->
                            <div class="flex gap-4 pt-8 border-t">
                                <button type="submit"
                                        class="flex-1 bg-black hover:bg-gray-800 text-white py-5 rounded-3xl font-semibold text-lg transition flex items-center justify-center gap-3">
                                    Сохранить ситуацию
                                </button>

                                <a href="/situations"
                                   class="flex-1 border border-gray-300 hover:bg-gray-50 text-gray-700 py-5 rounded-3xl font-semibold text-lg transition text-center">
                                    Отмена
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const grid = document.getElementById('thoughts-grid');
                const addButton = document.getElementById('add-thought');
                let counter = 2;

                // Синхронизация высоты двух textarea
                function syncPairHeights(pair) {
                    const textareas = pair.querySelectorAll('.thought-edit');
                    if (textareas.length !== 2) return;

                    const left = textareas[0];
                    const right = textareas[1];

                    // Убираем скролл
                    left.style.overflowY = 'hidden';
                    right.style.overflowY = 'hidden';

                    left.style.height = 'auto';
                    right.style.height = 'auto';

                    const maxHeight = Math.max(left.scrollHeight, right.scrollHeight, 110);

                    left.style.height = maxHeight + 'px';
                    right.style.height = maxHeight + 'px';
                }

                // Применяем синхронизацию ко всем парам
                function attachSync() {
                    document.querySelectorAll('.thought-pair').forEach(pair => {
                        const textareas = pair.querySelectorAll('.thought-edit');

                        textareas.forEach(textarea => {
                            textarea.addEventListener('input', () => {
                                syncPairHeights(pair);
                            });
                        });

                        // Начальная синхронизация
                        syncPairHeights(pair);
                    });
                }

                // Добавление новой пары
                addButton.addEventListener('click', () => {
                    const newPairHTML = `
                        <div class="thought-pair grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <textarea name="thoughts[${counter}].criticalContent" rows="2"
                                          class="thought-edit w-full px-6 py-5 border border-gray-200 rounded-3xl focus:outline-none focus:border-gray-500 focus:ring-2 focus:ring-gray-200 resize-y text-lg overflow-hidden">
                                </textarea>
                            </div>
                            <div>
                                <textarea name="thoughts[${counter}].realContent" rows="2"
                                          class="thought-edit w-full px-6 py-5 border border-gray-200 rounded-3xl focus:outline-none focus:border-gray-500 focus:ring-2 focus:ring-gray-200 resize-y text-lg overflow-hidden">
                                </textarea>
                            </div>
                        </div>`;

                    grid.insertAdjacentHTML('beforeend', newPairHTML);
                    counter++;

                    // Применяем синхронизацию к новой паре
                    setTimeout(attachSync, 10);
                });

                // Инициализация при загрузке
                attachSync();
            });
        </script>
    </body>
</html>
