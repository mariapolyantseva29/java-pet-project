version: "3.8"

services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6379 && redis-cli PING | grep -q PONG"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

volumes:
  redis_data: