<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <script src="https://cdn.tailwindcss.com"></script>
        <title>Login</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
    </head>

    <body class="bg-gray-100 font-sans">
        <div class="flex h-screen overflow-hidden">
            <!-- Main Content -->
            <div class="flex-1 overflow-auto">
                <div class="p-8">
                    <div class="max-w-4xl mx-auto">
                        <form id="loginForm" class="bg-white rounded-3xl shadow-sm p-10 space-y-8">
                            <div>
                                <h1 class="text-2xl font-bold text-gray-900 flex items-center gap-2">
                                    <i class="fa-solid fa-seedling"></i> Thought audit
                                </h1>
                                <p class="text-sm text-gray-500 mt-1">Живи спокойно и свободно</p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-3">
                                    Username
                                </label>
                                <input name="name" id="name" type="text"
                                       class="w-full px-6 py-5 border border-gray-200 rounded-3xl focus:outline-none focus:border-gray-500 focus:ring-2 focus:ring-gray-200 resize-y text-lg">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-3">
                                    Email
                                </label>
                                <input name="email" id="email" type="text"
                                       class="w-full px-6 py-5 border border-gray-200 rounded-3xl focus:outline-none focus:border-gray-500 focus:ring-2 focus:ring-gray-200 resize-y text-lg">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-3">
                                    Password
                                </label>
                                <input name="password" id="password" type="text"
                                       class="w-full px-6 py-5 border border-gray-200 rounded-3xl focus:outline-none focus:border-gray-500 focus:ring-2 focus:ring-gray-200 resize-y text-lg">
                            </div>

                            <!-- Кнопки -->
                            <div class="flex gap-4 pt-8 border-t">
                                <button type="submit"
                                        class="flex-1 bg-black hover:bg-gray-800 text-white py-5 rounded-3xl font-semibold text-lg transition flex items-center justify-center gap-3">
                                    Sign in
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <script>
            const form = document.getElementById('loginForm');

            form.addEventListener('submit', async function(event) {
                event.preventDefault();

                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                if (response.ok) {
                    window.location.href = '/situations';
                }
            });
        </script>
    </body>
</html>
